name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works whether the project files are at the repo root or still inside Learvia.zip.
      - name: Locate project
        run: |
          if [ ! -f settings.gradle.kts ] && [ -f Learvia.zip ]; then unzip -q Learvia.zip; fi
          FOUND=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          test -n "$FOUND"
          echo "ROOT=$(dirname "$FOUND")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: ${{ env.ROOT }}
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Learvia-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: ${{ env.ROOT }}/app/build/reports
          if-no-files-found: ignore
